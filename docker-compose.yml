# Single standalone instance with local SQLite. For multiple instances
# (e.g. srv1/srv2/srv3) sharing one metadata store, see docker-compose.multi.yml.
services:
  tempcdn:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_MAX_UPLOAD_MB: 100
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-tempcdn-files}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      DATABASE_DSN: file:/data/tempcdn.db?cache=shared&_fk=1&_journal_mode=WAL&_busy_timeout=5000
      FILE_TTL_HOURS: 24
      FILE_SWEEP_INTERVAL_MINUTES: 5
      SERVER_MAX_CONCURRENT_UPLOADS: 50
      IP_HASH_SALT: ${IP_HASH_SALT:-local-dev-salt}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:3000}
      METRICS_TOKEN: ${METRICS_TOKEN}
      ALLOWED_MIME_TYPES: "image/*,video/*,application/pdf,application/zip,text/plain"
      BLOCKED_EXTENSIONS: ".exe,.bat,.sh,.msi,.dll,.scr"
    volumes:
      - tempcdn-data:/data
    restart: unless-stopped

volumes:
  tempcdn-data:
