services:
  tempcdn:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_MAX_UPLOAD_MB: 100
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-tempcdn-files}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL}
      DATABASE_DSN: file:/data/tempcdn.db?cache=shared&_fk=1
      FILE_TTL_HOURS: 24
      RATE_LIMIT_UPLOADS_PER_IP_PER_HOUR: 20
      RATE_LIMIT_MAX_CONCURRENT_UPLOADS: 50
      IP_HASH_SALT: ${IP_HASH_SALT:-local-dev-salt}
      ALLOWED_MIME_TYPES: "image/*,video/*,application/pdf,application/zip,text/plain"
      BLOCKED_EXTENSIONS: ".exe,.bat,.sh,.msi,.dll,.scr"
    volumes:
      - tempcdn-data:/data
    restart: unless-stopped

volumes:
  tempcdn-data:
